services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: harvestguard
      POSTGRES_USER: harvestguard
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - harvestguard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvestguard -d harvestguard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  harvestguard_postgres:
